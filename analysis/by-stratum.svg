<text x="24" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#656d76" text-anchor="start" font-weight="normal">No arm's interval clears every other arm's, so this run does not separate them.</text>
<text x="24" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#656d76" text-anchor="start" font-weight="normal">k is the question count, which sets the width. The widest row here is reframe at k=9, bounded at 0.0166.</text>
<text x="24" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#656d76" text-anchor="start" font-weight="normal">More passes over the same questions do not narrow these; more questions do.</text>
<text x="24" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#656d76" text-anchor="start" font-weight="normal">Not drawn, because one question supports no interval: reframe (registered) (k=1). The table reports it.</text>
</svg>
