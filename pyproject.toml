[project]
name = "hup"
version = "0.1.0"
description = "Does user pushback make frontier LLMs abandon correct factual answers? An Inspect AI eval."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai==0.3.255",
    "openai==2.53.0",
    "anthropic==0.121.0",
    "google-genai==2.17.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=7.1", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hup"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ANN", "E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: runs a full eval against the in-process mock model (no API key, no network)",
]

# Coverage is configured here but not enabled in addopts: a bare `pytest` stays
# fast for local iteration, and CI opts in with --cov.
[tool.coverage.run]
source = ["src/hup"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95
